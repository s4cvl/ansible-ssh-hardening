---
- name: Sécurisation SSH de l'utilisateur ansible et installation de BIND
  hosts: serveurs
  become: true

  vars:
    srv_ansible_ip: "10.81.200.82"
    ansible_pubkey: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

  tasks:
    - name: Autoriser la clé d'ansible@srv-ansible uniquement depuis son IP
      ansible.builtin.copy:
        dest: /home/ansible/.ssh/authorized_keys
        content: |
          from="{{ srv_ansible_ip }}" {{ ansible_pubkey }}
        owner: ansible
        group: ansible
        mode: "0600"

    - name: Verrouiller le mot de passe de l'utilisateur ansible
      ansible.builtin.user:
        name: ansible
        password_lock: true

    - name: Interdire l'authentification par mot de passe pour ansible
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE MANAGED - restriction utilisateur ansible"
        block: |
          Match User ansible
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              AuthenticationMethods publickey
        validate: /usr/sbin/sshd -t -f %s
      notify: Redémarrer sshd

    - name: Installer BIND
      ansible.builtin.dnf:
        name:
          - bind
          - bind-utils
        state: present

    - name: Démarrer et activer named
      ansible.builtin.service:
        name: named
        state: started
        enabled: true

  handlers:
    - name: Redémarrer sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
